<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12111a">
<title>像素对决 · pixelfx duel</title>
<link rel="stylesheet" href="style.css?v=41">
</head>
<body>
<div class="wrap">
  <header>
    <h1>像素对决</h1>
    <p class="sub">pixelfx · 320×180 · 回合制</p>
  </header>

  <div class="stage">
    <canvas id="screen" width="1280" height="720"></canvas>
    <div id="flash"></div>
    <div id="cine" class="cine"><b id="cineName"></b><i id="cineSub"></i></div>
    <div id="route" class="hide"><div class="upwrap"><h2 id="routeTitle">路口</h2><p id="routeSub"></p><div id="routeList" class="gates"></div></div></div>
    <div id="upgrade" class="hide"><div class="upwrap"><h2 id="upTitle">强化</h2><p id="upSub"></p><div id="upList"></div></div></div>
    <div id="overlay" class="hide"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn">再来一局</button></div></div>
  </div>

  <div class="bars">
    <div class="bar you">
      <span class="who">你</span>
      <div class="track"><i id="php"></i></div>
      <b id="pht">120</b>
    </div>
    <div class="status" id="pstatus"></div>
    <div class="foebars" id="foeBars"></div>
    <div class="status" id="estatus"></div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="slots" id="slots"></div>
  <div class="moves" id="moves"></div>
  <button id="execBtn" type="button">执行编排</button>

  <p class="hint" id="hint">点怪物或血条切换目标 · 按钮出招（键盘 1–5，Tab 换目标）</p>
  <ul class="log" id="log"></ul>
</div>
<script type="module" src="dist/game.bundle.js?v=41"></script>
</body>
</html>

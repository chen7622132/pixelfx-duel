<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12111a">
<title>像素对决 · pixelfx duel</title>
<style>
:root{
  --ink:#12111a;
  --ink2:#1b1926;
  --line:#2e2a3d;
  --hot:#ff8a2a;
  --hp:#5fd06a;
  --foe:#e04a52;
  --dim:#7a7590;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:#e8e6f0;
  font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px 32px;
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
header{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
h1{margin:0;font-size:19px;letter-spacing:.06em}
.sub{margin:0;font-size:11px;color:var(--dim);letter-spacing:.04em}

.stage{position:relative;border:1px solid var(--line);background:#000;line-height:0;
  box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.5)}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .07s linear;
  background:radial-gradient(circle at 30% 70%,rgba(224,74,82,.55),rgba(224,74,82,0) 65%)}
#flash.on{opacity:1}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,9,16,.82);
  line-height:1.4;transition:opacity .25s}
#overlay.hide{opacity:0;pointer-events:none}
.card{text-align:center;padding:14px 18px;border:1px solid var(--line);background:var(--ink2);max-width:82%}
.card h2{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 12px;font-size:12px;color:#b9b4cc}
.card button{font:inherit;font-size:14px;padding:9px 18px;border:1px solid var(--hot);
  background:#2a1a10;color:#ffcf9a;cursor:pointer}
.card button:active{transform:translateY(1px)}

.bars{display:grid;gap:3px;margin:10px 0 12px}
.status{display:flex;gap:9px;align-items:center;min-height:15px;font-size:11px;color:#8f89a8;
  padding-left:2px;letter-spacing:.02em}
.status span{display:inline-flex;align-items:center;gap:3px}
.status .tag{font-size:10px;color:#f0c27a}
.status .none{color:#4b4560}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:11px}
.who{width:64px;color:#cfc9e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:9px;background:#241f31;border:1px solid var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0;width:100%;transform-origin:left;transition:transform .18s ease-out}
.bar.you .track i{background:linear-gradient(90deg,#3f9e4a,var(--hp))}
.bar.foe .track i{background:linear-gradient(90deg,#8f2b31,var(--foe))}
.bar b{width:34px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}


/* 三只怪的血条（可点选目标） */
.foebars{display:grid;gap:2px}
.fbar{display:grid;grid-template-columns:50px 1fr 26px;align-items:center;gap:6px;font-size:10px;
  color:#b9b4cc;padding:1px 3px;cursor:pointer;border:1px solid transparent;line-height:1.6}
.fbar.tgt{border-color:#5a4632;background:#1d1712}
.fbar.dead{opacity:.32;text-decoration:line-through}
.fbar .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ftrack{height:7px;background:#241f31;border:1px solid var(--line);position:relative;overflow:hidden}
.fbar .ftrack i{position:absolute;left:0;top:0;bottom:0;transition:width .18s ease-out;
  background:linear-gradient(90deg,#7d262c,#d8444c)}
.fbar.tgt .ftrack i{background:linear-gradient(90deg,#8a5216,#ff9a4a)}
.fbar b{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mv{position:relative;font:inherit;text-align:left;padding:9px 8px 10px;cursor:pointer;
  background:var(--ink2);border:1px solid var(--line);color:#e8e6f0;transition:border-color .15s,background .15s}
.mv em{display:inline-block;font-style:normal;font-size:10px;color:#0d0c12;background:#8f89a8;
  width:15px;height:15px;line-height:15px;text-align:center;margin-right:5px;vertical-align:1px}
.mv b{font-size:14px;letter-spacing:.02em}
.mv i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:3px}
.mv u{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--hot)}
/* 伤害预览数字（右上角） */
.mv s{position:absolute;right:7px;top:8px;text-decoration:none;font-size:11px;color:#8d87a6;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mv.lethal{border-color:#3f7d54;background:transparent}
.mv.lethal s{color:#8ce0a0}
.mv.lethal::before{content:"必杀";position:absolute;left:-1px;top:-7px;font-size:9px;
  background:#274a33;color:#9edcb0;padding:1px 4px;letter-spacing:.05em}
.mv.chance s{color:#e8c060}

/* 伤害日志 */
.log{list-style:none;margin:9px 0 0;padding:0;font-size:11px;color:#8a84a2;
  display:grid;gap:1px;max-height:76px;overflow:hidden;font-variant-numeric:tabular-nums}
.log li{display:flex;gap:7px;line-height:1.5}
.log li span{flex:0 0 26px;color:#5e5878}
.log li b{font-weight:600;color:#cfc9e0}
.log li.hit b{color:#ffd18a}
.log li.hurt b{color:#ff8585}
.log li.sys b{color:#8ab4ff}
.log li.win b{color:#8ce0a0}
.mv.ready:hover{border-color:#5b5474}
.mv.busy{opacity:.45;cursor:default}
.mv.cool{border-color:#4a3a24}
.mv.cool u{width:100%;background:#7a5a2e}
.hint{margin:10px 2px 0;font-size:11px;color:var(--dim);min-height:15px}

/* 可打断提示：敌人蓄力时突刺按钮发光 */
.mv.hint-break{border-color:#ff5a4a;background:#2a1412}
.mv.hint-break b{color:#ffb0a2}
.mv.hint-break::after{content:"可打断";position:absolute;top:-7px;right:-1px;font-size:9px;
  background:#ff5a4a;color:#1a0806;padding:1px 4px;letter-spacing:.05em}

@media (max-width:430px){
  h1{font-size:16px}
  .moves{grid-template-columns:repeat(2,1fr)}
  .mv.fin{grid-column:1/-1}
  .mv b{font-size:12px}
  .mv s{font-size:10px;right:5px;top:7px}
}

/* 终结技按钮：独占一行，能量满时亮 */
.mv.fin{grid-column:1/-1;border-color:#3a3348}
.mv.fin em{background:#6d6585}
.mv.fin b{color:#cfc7e6}
.mv.fin u{width:0;background:#4a3f66;height:3px;transition:width .25s ease-out}
.mv.fin.armed{border-color:var(--hot);background:#2a1a10}
.mv.fin.armed em{background:var(--hot);color:#1a0d05}
.mv.fin.armed b{color:#ffcf9a}
.mv.fin.armed u{background:linear-gradient(90deg,#ff8a2a,#ffd18a);height:3px}
.mv.fin.armed:not(.busy){animation:finPulse 1.4s ease-in-out infinite}
@keyframes finPulse{0%,100%{box-shadow:0 0 0 rgba(255,138,42,0)}50%{box-shadow:0 0 18px rgba(255,138,42,.45)}}

/* 终结技大标题 */
.cine{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;
  pointer-events:none;opacity:0;transform:scale(.94);transition:opacity .22s ease-out,transform .22s ease-out;line-height:1.15;
  background:radial-gradient(ellipse at 50% 56%,rgba(0,0,0,0) 26%,rgba(0,0,0,.58) 100%)}
.cine.on{opacity:1;transform:scale(1)}
.cine b{font-size:clamp(20px,6vw,30px);letter-spacing:.18em;color:#fff;
  text-shadow:0 0 20px rgba(255,150,60,.85),2px 2px 0 #000,0 0 3px #000}
.cine i{font-style:normal;font-size:10px;letter-spacing:.32em;color:#ffb96a;text-transform:uppercase}

/* 白闪（终结技命中） */
#flash.micro{background:radial-gradient(circle at 55% 58%,rgba(255,255,255,.42),rgba(255,255,255,0) 60%)}
#flash.white{background:radial-gradient(circle at 55% 55%,rgba(255,255,255,.92),rgba(255,240,210,.55) 40%,rgba(255,255,255,0) 72%)}

/* 层/波进度 */
.progress{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:11px;color:#8f89a8}
.progress b{color:#ffcf9a;font-weight:600;letter-spacing:.04em}
.progress .pips{display:flex;gap:3px}
.progress .pip{width:14px;height:4px;background:#2b2639}
.progress .pip.on{background:#ff8a2a}
.progress .pip.boss{background:#8f2b31}

/* 三选一强化 */
#upgrade{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,9,16,.9);z-index:6;line-height:1.4}
#upgrade.hide{display:none}
.upwrap{width:90%;max-width:330px}
.upwrap h2{margin:0 0 2px;font-size:15px;letter-spacing:.08em}
.upwrap p{margin:0 0 9px;font-size:10px;color:#8f89a8}
#upList{display:grid;gap:6px}
.up{text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--ink2);
  color:#e8e6f0;font:inherit;cursor:pointer;transition:border-color .12s}
.up:hover,.up:active{border-color:var(--hot)}
.up b{display:block;font-size:13px;color:#ffcf9a}
.up i{display:block;font-style:normal;font-size:10px;color:#8f89a8;margin-top:2px}
.up.new b{color:#8ce0a0}

/* 层间路线选择 */
#route{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,9,16,.92);z-index:7;line-height:1.4}
#route.hide{display:none}
.gates{display:grid;gap:7px}
.gate{text-align:left;padding:10px 11px;border:1px solid var(--line);background:var(--ink2);
  color:#e8e6f0;font:inherit;cursor:pointer;transition:border-color .12s,transform .08s}
.gate:hover,.gate:active{border-color:var(--hot);transform:translateY(-1px)}
.gate b{display:block;font-size:14px;color:#ffcf9a}
.gate i{display:block;font-style:normal;font-size:10px;color:#8f89a8;margin-top:3px;line-height:1.5}
.gate .cost{color:#c98b6c}
.gate.risk b{color:#ff8a8a}
.gate.rest b{color:#8ce0a0}

/* 行动槽（左→右 = 结算顺序） */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 6px}
.slot{height:46px;border:1px dashed #3a3348;display:grid;place-items:center;text-align:center;
  font-size:10px;color:#4f4968;cursor:pointer;position:relative;line-height:1.25;padding:2px}
.slot .n{position:absolute;left:4px;top:2px;font-size:8px;color:#4f4968}
.slot.filled{border-style:solid;border-color:#6a5a7a;color:#e8e6f0;background:#1b1926}
.slot.filled .n{color:#8f89a8}
.slot.chain{border-color:#ff8a2a;background:#241a10}
.slot b{display:block;font-size:11px;color:#ffcf9a;font-weight:600}
.slot i{display:block;font-style:normal;font-size:9px;color:#7a7590}
#execBtn{width:100%;padding:11px;margin:2px 0 0;font:inherit;font-size:14px;letter-spacing:.1em;
  background:#2a1a10;border:1px solid var(--hot);color:#ffcf9a;cursor:pointer}
#execBtn:active{transform:translateY(1px)}
#execBtn:disabled{background:#191722;border-color:#2e2a3d;color:#4f4968;cursor:default}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>像素对决</h1>
    <p class="sub">pixelfx · 320×180 · 回合制</p>
  </header>

  <div class="stage">
    <canvas id="screen" width="1280" height="720"></canvas>
    <div id="flash"></div>
    <div id="cine" class="cine"><b id="cineName"></b><i id="cineSub"></i></div>
    <div id="route" class="hide"><div class="upwrap"><h2 id="routeTitle">路口</h2><p id="routeSub"></p><div id="routeList" class="gates"></div></div></div>
    <div id="upgrade" class="hide"><div class="upwrap"><h2 id="upTitle">强化</h2><p id="upSub"></p><div id="upList"></div></div></div>
    <div id="overlay" class="hide"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn">再来一局</button></div></div>
  </div>

  <div class="bars">
    <div class="bar you">
      <span class="who">你</span>
      <div class="track"><i id="php"></i></div>
      <b id="pht">120</b>
    </div>
    <div class="status" id="pstatus"></div>
    <div class="foebars" id="foeBars"></div>
    <div class="status" id="estatus"></div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="slots" id="slots"></div>
  <div class="moves" id="moves"></div>
  <button id="execBtn" type="button">执行编排</button>

  <p class="hint" id="hint">点怪物或血条切换目标 · 按钮出招（键盘 1–5，Tab 换目标）</p>
  <ul class="log" id="log"></ul>
</div>
